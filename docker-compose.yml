services:
  backend:
    build:
      context: ./backend
    container_name: campushub-backend
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
    restart: unless-stopped

  client:
    build:
      context: ./client
      args:
        VITE_API_BASE_URL: http://localhost:5000/api
    container_name: campushub-client
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
